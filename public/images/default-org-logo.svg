<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="#6366f1"/>
  
  <!-- Organization icon -->
  <g transform="translate(100, 100)">
    <!-- Building/Organization icon -->
    <path d="M-40,-30 L-40,40 L40,40 L40,-30 Z" fill="white" opacity="0.9"/>
    
    <!-- Windows -->
    <rect x="-30" y="-20" width="15" height="15" fill="#6366f1" rx="2"/>
    <rect x="-30" y="5" width="15" height="15" fill="#6366f1" rx="2"/>
    <rect x="-30" y="25" width="15" height="10" fill="#6366f1" rx="2"/>
    
    <rect x="15" y="-20" width="15" height="15" fill="#6366f1" rx="2"/>
    <rect x="15" y="5" width="15" height="15" fill="#6366f1" rx="2"/>
    <rect x="15" y="25" width="15" height="10" fill="#6366f1" rx="2"/>
    
    <!-- Door -->
    <rect x="-10" y="15" width="20" height="25" fill="#4f46e5" rx="2"/>
    
    <!-- Roof -->
    <path d="M-45,-30 L0,-50 L45,-30" fill="white" opacity="0.9"/>
  </g>
</svg>

