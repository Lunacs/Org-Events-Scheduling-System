# docker/nginx.conf
server {
    listen 80 default_server;
    server_name _;

    # Allow file uploads up to 12MB (slightly above 10MB app limit for overhead)
    client_max_body_size 12M;

    root /var/www/html/public;
    index index.php;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # ── Gzip Compression ─────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/woff2;

    # ── Vite hashed assets — immutable long-term cache ───────────────
    location /build/ {
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Optimized images — long-term cache ───────────────────────────
    location /images/optimized/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Livewire Assets (dynamic PHP route, not a static file) ──────
    location ^~ /livewire {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Other Static Assets (images, fonts, favicon) ─────────────────
    location ~* \.(ico|jpg|jpeg|png|gif|svg|webp|woff|woff2|ttf|eot|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, no-transform";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_intercept_errors on;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Keep FastCGI connections alive to reduce reconnect overhead
        fastcgi_keep_conn on;

        # Private cache for authenticated HTML responses
        add_header Cache-Control "private, no-cache";
    }

    location ~ /\.ht {
        deny all;
    }
}
